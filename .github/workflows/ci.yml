name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r requirements.txt
      # Dados reais já coletados (branch data, pública, sem a classificação) para o teste que
      # confere se a nota de aderência diferencia as oportunidades (valores distintos e faixas).
      - name: Baixar a base coletada (branch data)
        run: |
          git fetch --depth=1 origin data:refs/remotes/origin/data
          git worktree add "$RUNNER_TEMP/dados-reais" origin/data
      # Regras de casamento: base sintética. Os casos de aceite usam a base REAL (privada),
      # lida do Supabase com o secret; sem o secret, eles aparecem como "skipped" (com o motivo).
      # Só o resultado (passou/falhou) e contagens vão para o log: nada da base é impresso.
      - run: python -m pytest -q -rs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://wbhhfybpflqnnelwttdv.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RADAR_DADOS_REAIS: ${{ runner.temp }}/dados-reais

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Validação com dados REAIS do PNCP. Não bloqueia o CI (a fonte pode estar instável),
  # mas o log documenta o contrato real da API. Logs de repositório público são públicos:
  # a amostra classificada usa a base SINTÉTICA de ofertas (a real nunca aparece aqui).
  source-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      RADAR_OFERTAS_FILE: ${{ github.workspace }}/collector/tests/fixtures/ofertas_sinteticas.json
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnóstico das APIs do PNCP
        continue-on-error: true
        timeout-minutes: 12
        run: python -m radar probe --days 2
      - name: Diagnóstico de PCA e das rotas do portal
        continue-on-error: true
        timeout-minutes: 25
        run: python -m radar probe --pca
      - name: Classificação de licitações reais (amostra, base sintética)
        continue-on-error: true
        timeout-minutes: 20
        run: python -m radar sample --days 4 --max-pages 30 --top 60

  # Ponta a ponta com dados reais do PNCP: update (orçamento curto) -> export -> build do site.
  # Artefatos de repositório público são públicos: usa a base SINTÉTICA de ofertas e o site é
  # construído sem Supabase (modo local, sem login). Não bloqueia o CI.
  pipeline-e2e:
    # ubuntu-24.04: o Playwright ainda não instala o Chromium no ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      RADAR_OFERTAS_FILE: ${{ github.workspace }}/collector/tests/fixtures/ofertas_sinteticas.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coleta real curta (sem carga histórica)
        working-directory: collector
        run: python -m radar update --data-dir ../e2e-data --budget-min 25 --no-backfill
      - name: Export (base sintética) e resumo
        run: |
          cd collector && python -m radar export --data-dir ../e2e-data --out ../web/public/data && cd ..
          python - <<'EOF'
          import json
          m = json.load(open("e2e-data/meta.json"))
          print("status:", m["status"], "| falhas:", m["fontes_com_falha"])
          for k, v in m["fontes"].items():
              print(f"  {k:28s} {v.get('status'):10s} vistos={v.get('registros_vistos')} novos={v.get('novos')} erro={(v.get('erro') or '')[:150]}")
          print("base:", m["totais_base"], "| http:", m["cliente_http"])
          pub = json.load(open("web/public/data/opportunities.json"))["items"] + json.load(open("web/public/data/atas.json"))["items"]
          print("publicados (base sintética):", len(pub))
          for x in sorted(pub, key=lambda x: -(x["classificacao"].get("score") or 0))[:15]:
              c = x["classificacao"]
              print(f"[{c.get('score') or 0:>3} {c.get('faixa') or '-':9s} {'+'.join(c['portfolio'])}] {x['tipo']:11s} {x['estagio']:18s} {x['id']} | {x['objeto'][:100]}")
          EOF
      - name: Teste dos links oficiais coletados (amostra)
        run: |
          python - <<'EOF'
          import json, requests, time
          items = json.load(open("e2e-data/items.json"))["items"] + json.load(open("e2e-data/atas.json"))["items"]
          urls = []
          for x in items:
              for k in ("origem", "pncp"):
                  if x["links"].get(k): urls.append((k, x["links"][k]))
              for d in (x.get("documentos") or [])[:1]: urls.append(("documento", d["url"]))
          seen, n_ok, n = set(), 0, 0
          for kind, u in urls:
              if u in seen or n >= 40: continue
              seen.add(u); n += 1
              try:
                  r = requests.get(u, timeout=30, allow_redirects=True, stream=True)
                  code = r.status_code; r.close()
              except Exception as e:
                  code = type(e).__name__
              n_ok += code == 200
              print(f"{kind:10s} {code} {u[:150]}")
              time.sleep(1)
          print(f"\n{n_ok}/{n} links responderam HTTP 200")
          EOF

      - name: Build do site (modo local, sem Supabase)
        working-directory: web
        run: npm ci && npm run build
      - name: Teste funcional da interface com dados reais (Playwright)
        working-directory: web
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          mkdir -p ../ui-shots
          (npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &)
          sleep 4
          node tests-e2e/ui-check.mjs http://localhost:4173/ ../ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site-e2e
          path: web/dist
          retention-days: 7
