# =============================================================================
# RADAR TLS — Configuração do portfólio e do motor de classificação
# =============================================================================
# Este arquivo é a "fonte de verdade" da classificação. Pode ser editado sem
# alterar código. Após editar, rode:
#     cd collector && python -m pytest -q          # garante que os casos de teste continuam ok
#     python -m radar reclassify --data-dir ../data  # (opcional) reclassifica a base local
# A próxima execução do GitHub Actions reclassifica toda a base automaticamente.
#
# Como os termos funcionam
#   - O texto é normalizado: minúsculas, sem acentos, espaços simples.
#   - Termos são procurados como palavras/expressões inteiras. Plural simples
#     (s / es / ões / ais) é aceito automaticamente na ÚLTIMA palavra do termo.
#   - Escreva os termos SEM acento (ex.: "manutencao"). Acentos também são aceitos
#     (são removidos ao carregar), mas manter sem acento evita dúvidas.
#   - Pesos: strong = 1.0 | medium = 0.5 | weak = 0.2 (força de evidência).
#
# IMPORTANTE: aderência tecnológica ≠ elegibilidade comercial. As categorias
# abaixo indicam onde o TLS PODE atuar; toda oportunidade exige validação
# comercial. A coluna `tls_coverage` dos fabricantes reflete apenas o que foi
# confirmado em material PÚBLICO da IBM (ver docs/PORTFOLIO.md).
# =============================================================================

version: 3

# ---------------------------------------------------------------------------
# Pesos do score (soma = 100). Aderência técnica = portfolio + support + vendor
# (+ evidence). Urgência comercial = value + timing. A urgência comercial é
# multiplicada pelo "fator técnico", portanto valor alto NÃO compensa falta de
# aderência.
# ---------------------------------------------------------------------------
weights:
  portfolio: 35   # aderência ao portfólio (ofertas abaixo)
  support: 25     # evidência de suporte/manutenção/garantia
  vendor: 15      # fabricante/tecnologia compatível
  value: 10       # potencial comercial (valor estimado)
  timing: 10      # oportunidade temporal (estágio)
  evidence: 5     # completude das evidências

# Força de evidência necessária para atingir a pontuação máxima do componente.
saturation:
  portfolio: 1.0
  support: 1.5

# Sem nenhum termo "strong" ou "medium" de oferta, o score total fica limitado
# a este teto (evita que ocorrências isoladas de "rede"/"suporte" pontuem alto).
cap_without_strong_evidence: 35

# Se o PRIMEIRO item relevante citado no objeto for um termo fora do escopo
# (ex.: "aquisição de microcomputadores ... com Wi-Fi"), o score fica limitado a este teto.
cap_primary_out_of_scope: 45

# Fator técnico: aderência técnica (0..1) a partir da qual a urgência comercial
# conta integralmente. Abaixo disso, value/timing são reduzidos proporcionalmente.
technical_factor_full_at: 0.55

thresholds:          # classificação final (calibrável)
  alta: 80           # 80–100 alta prioridade
  analisar: 60       # 60–79 analisar
  indireto: 40       # 40–59 potencial indireto
                     # 0–39 baixa aderência

# Registros com score abaixo deste valor não são armazenados (reduz a base).
min_score_to_store: 25

# Valor estimado -> pontos (0..1 do peso "value"). Valor sigiloso/ausente = unknown.
value_bands:
  - {min: 5000000, factor: 1.0}
  - {min: 1000000, factor: 0.8}
  - {min: 300000, factor: 0.6}
  - {min: 100000, factor: 0.4}
  - {min: 0.01, factor: 0.2}
value_unknown_factor: 0.3

# Estágio -> pontos (0..1 do peso "timing"). Quanto mais cedo/acionável, maior.
timing_by_stage:
  planejamento: 1.0
  preparacao: 0.9
  propostas_abertas: 1.0
  publicada: 0.8
  julgamento: 0.3
  ata_vigente: 0.7
  concluida: 0.2
  encerrada: 0.0

